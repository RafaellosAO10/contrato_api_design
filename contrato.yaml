openapi: 3.0.0

info:
  title: contrato_api_design
  description: Gerencia o catálogo de um fast food.
  version: v1

servers:
  - url: https://api.contrato_api_design.com/v1
    description: Servidor de produção

security:
  - oauth2Auth: []

tags:
  - name: contrato_api_design
    description: Operações da API

paths:

  /produtos:
    get:
      summary: Listar produtos
      tags:
        - contrato_api_design

      parameters:
        - name: busca
          in: query
          required: false
          description: Texto livre para filtrar por nome
          schema:
            type: string

        - name: categoria
          in: query
          required: false
          description: Filtrar por categoria
          schema:
            type: string

        - name: ordem
          in: query
          required: false
          description: Direção da ordenação
          schema:
            type: string
            enum:
              - asc
              - desc

        - name: page
          in: query
          required: false
          description: Número da página
          schema:
            type: integer
            default: 1

        - name: per_page
          in: query
          required: false
          description: Itens por página
          schema:
            type: integer
            default: 15

      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: object
                properties:

                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Produto'

                  total:
                    type: integer
                    description: Total de registros

                  total_pages:
                    type: integer
                    description: Total de páginas

                  page:
                    type: integer
                    description: Página atual

                  per_page:
                    type: integer
                    description: Itens por página

        '400':
          description: Dados inválidos

        '401':
          description: Não autorizado

    post:
      summary: Criar produto
      tags:
        - contrato_api_design

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoInput'

      responses:
        '201':
          description: Produto criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'

        '400':
          description: Dados inválidos

        '401':
          description: Não autorizado

  /produtos/{id}:

    get:
      summary: Buscar produto por ID
      tags:
        - contrato_api_design

      parameters:
        - name: id
          in: path
          required: true
          description: ID do produto
          schema:
            type: integer

      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'

        '404':
          description: Produto não encontrado

    put:
      summary: Atualizar produto completo
      tags:
        - contrato_api_design

      parameters:
        - name: id
          in: path
          required: true
          description: ID do produto
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoInput'

      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'

        '400':
          description: Dados inválidos

        '404':
          description: Produto não encontrado

    delete:
      summary: Remover produto
      tags:
        - contrato_api_design

      parameters:
        - name: id
          in: path
          required: true
          description: ID do produto
          schema:
            type: integer

      responses:
        '200':
          description: Produto removido com sucesso

        '404':
          description: Produto não encontrado

  /pedidos:
    post:
      summary: Criar pedido
      tags:
        - contrato_api_design

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoInput'

      responses:
        '201':
          description: Pedido criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'

        '400':
          description: Dados inválidos

        '401':
          description: Não autorizado

  /pedidos/{id}:
    get:
      summary: Buscar pedido por ID
      tags:
        - contrato_api_design

      parameters:
        - name: id
          in: path
          required: true
          description: ID do pedido
          schema:
            type: integer

      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'

        '404':
          description: Pedido não encontrado

  /users:
    get:
      summary: Consultar usuários
      tags:
        - contrato_api_design

      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

        '401':
          description: Não autorizado

  /users/{id}:
    patch:
      summary: Atualizar informações do usuário
      tags:
        - contrato_api_design

      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'

      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '400':
          description: Dados inválidos

        '404':
          description: Usuário não encontrado

components:

  securitySchemes:

    oauth2Auth:
      type: oauth2

      flows:
        clientCredentials:
          tokenUrl: https://api.contrato_api_design.com/oauth/token

          scopes: {}

  schemas:

    Produto:
      type: object

      properties:

        id:
          type: integer
          description: ID único do produto

        nome:
          type: string
          description: Nome do produto

        preco:
          type: number
          format: float
          description: Preço do produto

        descricao:
          type: string
          description: Descrição do produto

        categoria:
          $ref: '#/components/schemas/Categoria'

        imagens:
          type: array
          description: Lista de imagens
          items:
            type: string
            format: uri

        criado_em:
          type: string
          format: date-time
          description: Data de criação

    ProdutoInput:
      type: object

      required:
        - nome
        - descricao
        - preco

      properties:

        nome:
          type: string

        descricao:
          type: string

        preco:
          type: number
          format: float

        categoria_id:
          type: integer

    Categoria:
      type: object

      properties:

        id:
          type: integer

        nome:
          type: string

    Pedido:
      type: object

      properties:

        id:
          type: integer

        produtos:
          type: array
          items:
            $ref: '#/components/schemas/Produto'

        total:
          type: number
          format: float

        status:
          type: string
          example: pendente

        criado_em:
          type: string
          format: date-time

    PedidoInput:
      type: object

      required:
        - produtos

      properties:

        produtos:
          type: array
          description: IDs dos produtos
          items:
            type: integer

        observacao:
          type: string

    User:
      type: object

      properties:

        id:
          type: integer

        nome:
          type: string

        email:
          type: string
          format: email

        criado_em:
          type: string
          format: date-time

    UserUpdateInput:
      type: object

      properties:

        nome:
          type: string

        email:
          type: string
          format: email
